name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pipeline (Sample Mode)
      run: |
        python main.py --sample

    - name: Run Tests
      run: |
        # logic to run pytest only if tests directory exists
        if [ -d "tests" ]; then python -m pytest tests/; else echo "No tests folder found, skipping pytest"; fi
